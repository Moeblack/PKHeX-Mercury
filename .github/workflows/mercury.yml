name: Mercury build

on:
  push:
    branches: [mercury]
  pull_request:
    branches: [mercury]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mercury:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Mercury solution
        run: dotnet build PKHeX.Mercury.slnx -c Release
      - name: Publish Windows x64 portable application
        run: dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj -c Release -r win-x64 --self-contained true -o artifacts/native-publish
      - name: Add license and usage information
        shell: pwsh
        run: |
          Copy-Item LICENSE artifacts/native-publish/LICENSE.txt
          Copy-Item README.md artifacts/native-publish/README.md
          Copy-Item docs artifacts/native-publish/docs -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Mercury-win-x64
          path: artifacts/native-publish/
